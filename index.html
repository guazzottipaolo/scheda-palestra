<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#111418">
  <meta name="description" content="La tua scheda di allenamento, leggibile in palestra.">
  <title>Scheda Palestra</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app"></main>

  <div id="timer" class="timer" hidden>
    <div class="timer-bar"><span></span></div>
    <div class="timer-row">
      <button type="button" class="tbtn" data-t="-15">−15</button>
      <div class="timer-main">
        <div class="timer-label"></div>
        <div class="timer-time">0:00</div>
      </div>
      <button type="button" class="tbtn" data-t="15">+15</button>
      <button type="button" class="tbtn tbtn-stop" data-t="stop" aria-label="Chiudi timer">✕</button>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <div id="dialog" class="dialog" hidden role="dialog" aria-modal="true">
    <div class="dialog-card">
      <p class="dialog-msg"></p>
      <div class="dialog-btns">
        <button type="button" class="btn" data-d="cancel">Annulla</button>
        <button type="button" class="btn btn-primary" data-d="ok">OK</button>
      </div>
    </div>
  </div>

  <div id="cheer" class="cheer" hidden role="status">
    <div class="cheer-card">
      <div class="cheer-icon">💪</div>
      <div class="cheer-title">Ben fatto!</div>
      <div class="cheer-sub"></div>
    </div>
  </div>

  <input type="file" id="file-scheda" hidden>
  <input type="file" id="file-backup" accept=".json,application/json" hidden>
  <input type="file" id="file-media" accept="image/*,video/*" capture="environment" hidden>

  <script src="vendor/xlsx.mini.min.js"></script>
  <script src="parser.js"></script>
  <script src="app.js"></script>
</body>
</html>
